name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://yeluo45.github.io/nodeskclaw-design/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install
        working-directory: ./docs-site

      - name: Build
        run: pnpm run build
        working-directory: ./docs-site

      - name: Debug dist location
        run: |
          echo "=== github.workspace ===" && echo ${{ github.workspace }}
          echo "=== docs-site contents ===" && ls -la ${{ github.workspace }}/docs-site/
          echo "=== .vitepress contents ===" && ls -la ${{ github.workspace }}/docs-site/.vitepress/ 2>/dev/null || echo "no .vitepress"
          echo "=== dist contents ===" && ls -la ${{ github.workspace }}/docs-site/.vitepress/dist/ 2>/dev/null || echo "no dist"
          echo "=== find for dist dirs ===" && find ${{ github.workspace }} -name "dist" -type d 2>/dev/null

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ github.workspace }}/docs-site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
