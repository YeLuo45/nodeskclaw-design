name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://yeluo45.github.io/nodeskclaw-design/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          cd docs-site && npm install

      - name: Build
        run: |
          cd docs-site && npm run docs:build

      - name: Debug dist
        run: |
          echo "=== pwd ===" && pwd
          echo "=== docs-site contents ===" && ls -la docs-site/
          echo "=== .vitepress contents ===" && ls -la docs-site/.vitepress/ 2>/dev/null || echo "no .vitepress"
          echo "=== dist contents ===" && ls -la docs-site/.vitepress/dist/ 2>/dev/null || echo "no dist"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
